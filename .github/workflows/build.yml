name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux/amd64
            name: moadhn-linux
            output: moadhn-linux.bin
          - platform: macos-latest
            os: darwin/universal
            name: moadhn-macos
            output: moadhn-macos.app

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev

      - name: Install Wails
        run: go install github.com/wailsapp/v2/cmd/wails@latest

      - name: Build Application
        run: wails build -platform ${{ matrix.os }} -o ${{ matrix.output }}

      - name: Package macOS App
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          # Zip the generated .app bundle
          zip -r ../../${{ matrix.name }}.zip ${{ matrix.output }}

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/bin/${{ matrix.output }}
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files for release
        run: |
          mkdir release_files
          # Copy all executable and compressed files to release_files
          find artifacts -type f \( -name "*.bin" -o -name "*.zip" \) -exec cp -v {} release_files/ \;

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          tag_name: latest
          name: "Latest Build"
          body: "هذه النسخة تحتوي على أحدث التحديثات التلقائية."
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
