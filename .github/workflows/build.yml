name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            os: linux/amd64
            name: moadhn-linux
          - platform: macos-latest
            os: darwin/universal
            name: moadhn-macos

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Application
        uses: dAppServer/wails-build-action@v2
        with:
          build-name: ${{ matrix.name }}
          build-platform: ${{ matrix.os }}
          go-version: '1.21'
          package: false

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/bin/*
            build/bin/moadhn.app
