name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            os: linux/amd64
            name: moadhn-linux
            output: moadhn
          - platform: macos-latest
            os: darwin/universal
            name: moadhn-macos
            output: moadhn.app

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev rpm

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Application
        run: wails build -platform ${{ matrix.os }} -o ${{ matrix.output }}

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          # Use hdiutil which is more reliable in Headless environments
          mkdir -p dmg_root
          # Copy any folder ending in .app from build/bin
          cp -r build/bin/*.app dmg_root/
          hdiutil create -volname "Moadhn" -srcfolder dmg_root -ov -format UDZO moadhn-macos.dmg

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          # Download linuxdeploy
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          
          # Create Desktop file
          echo "[Desktop Entry]
          Type=Application
          Name=Moadhn
          Exec=moadhn
          Icon=moadhn
          Categories=Utility;" > moadhn.desktop
          
          # Run linuxdeploy
          export OUTPUT="moadhn-linux.AppImage"
          # Create a dummy AppDir and run linuxdeploy
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/bin/${{ matrix.output }} -i build/appicon.png -d moadhn.desktop --output appimage
          mv moadhn-linux*.AppImage moadhn-linux.AppImage

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            moadhn-macos.dmg
            moadhn-linux.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare files for release
        run: |
          mkdir release_files
          # Copy .dmg and .AppImage files
          find artifacts -type f \( -name "*.dmg" -o -name "*.AppImage" \) -exec cp -v {} release_files/ \;

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          tag_name: latest
          name: "Latest Build"
          body: "هذه النسخة تحتوي على أحدث التحديثات التلقائية (DMG للماك و AppImage للينكس)."
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
