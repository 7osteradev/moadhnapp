name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            platform: linux/amd64
            artifact: moadhn-linux.AppImage
          - os: macos-latest
            name: macos
            platform: darwin/universal
            artifact: moadhn-macos.dmg
          - os: windows-latest
            name: windows
            platform: windows/amd64
            artifact: build/windows/installer/MoadhnApp_Setup.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev

      - name: Install Wails CLI
        shell: bash
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "Installing Wails $WAILS_VERSION"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build application
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Wails names the Linux binary with the platform suffix; rename it so
          # the desktop entry and the AppImage launcher agree on the name.
          mv build/bin/moadhn-linux-amd64 build/bin/moadhn

          cp build/appicon.png moadhn.png
          cat > moadhn.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Moadhn
          Exec=moadhn
          Icon=moadhn
          Categories=Utility;
          Terminal=false
          EOF

          # Extract-and-run avoids needing FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN=1 \
          OUTPUT=moadhn-linux.AppImage \
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e build/bin/moadhn \
            -d moadhn.desktop \
            -i moadhn.png \
            --output appimage

          ls -lh moadhn-linux.AppImage
          test -f moadhn-linux.AppImage

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg_root
          cp -R build/bin/*.app dmg_root/
          hdiutil create -volname "Moadhn" -srcfolder dmg_root -ov -format UDZO moadhn-macos.dmg
          ls -lh moadhn-macos.dmg

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe (Inno Setup) was not found"
          }
          & $iscc "moadhnapp.iss"
          Get-ChildItem build/windows/installer/*.exe | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moadhn-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Build' }}
          body: "هذه النسخة تحتوي على أحدث التحديثات التلقائية (Windows و DMG للماك و AppImage للينكس)."
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
